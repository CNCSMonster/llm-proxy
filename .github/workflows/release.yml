name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: llm-proxy
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: llm-proxy
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: llm-proxy
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: llm-proxy
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: llm-proxy.exe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross-compilation tools (Linux aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build
        run: cargo build --release --target ${{ matrix.target }} --features formal
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: cd target/${{ matrix.target }}/release && tar czf ../../../llm-proxy-${{ github.ref_name }}-${{ matrix.target }}.tar.gz ${{ matrix.artifact }}
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: cd target/${{ matrix.target }}/release && 7z a ../../../llm-proxy-${{ github.ref_name }}-${{ matrix.target }}.zip ${{ matrix.artifact }}
      - uses: actions/upload-artifact@v4
        with:
          name: llm-proxy-${{ matrix.target }}
          path: llm-proxy-${{ github.ref_name }}-${{ matrix.target }}.*
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
